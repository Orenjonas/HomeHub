version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: homehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: homehub
      POSTGRES_PASSWORD: homehub
      POSTGRES_DB: homehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homehub -d homehub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
