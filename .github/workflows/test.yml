name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dotnet-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Restore and test when solution exists
        shell: bash
        run: |
          if ls *.sln >/dev/null 2>&1; then
            dotnet restore
            dotnet test --configuration Release --no-restore
          else
            echo "No solution file yet. Skipping restore/test for bootstrap phase."
          fi
